<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特色定制出行</title><link rel="stylesheet" href="prototype.css"></head><body><main class="app"><div class="status"><span>9:41</span><span>● ● ▰</span></div><nav class="nav"><a href="index.html">‹</a><strong>特色定制出行</strong><a href="#">···</a></nav><div class="detail-hero">特色线路头图 / 家庭出行</div><header class="detail-head"><h1>按你的假期长度，选择进村方式</h1><p id="routeSubtitle">从茶园到侗寨，完整走进五天村寨生活</p><div class="tags"><span class="tag">2人起订</span><span class="tag">专属小团</span><span class="tag">顾问确认日期</span></div></header><section class="section alt"><div class="route-tabs"><button class="route-tab active" data-days="5">5天4晚</button><button class="route-tab" data-days="3">3天2晚</button><button class="route-tab" data-days="2">2天1晚</button></div><div id="routePlan" class="route-plan"></div><a class="route-more" id="fullRoute" href="route-custom.html?days=5">查看完整行程</a></section><section class="section"><h2>同行人数与套餐价</h2><p class="desc">表内已有价格直接展示；待核定线路由顾问结合日期与住宿报价。</p><div class="package-list" id="packageList"></div></section><section class="section alt"><h2>费用包含</h2><div class="info"><div class="form-row">行程所列境教活动与在地带领</div><div class="form-row">行程内住宿、用餐及村内接驳</div><div class="form-row">行前顾问沟通与出行路书</div></div></section><div class="bottom-space"></div><div class="bottom"><a class="secondary" id="fullRouteBottom" href="route-custom.html?days=5">完整行程</a><button class="primary" id="openBooking">咨询5天4晚报价</button></div></main><div class="modal-mask" id="bookingModal"><div class="modal-card"><div class="modal-handle"></div><div class="modal-title"><div><h2>预订特色定制出行</h2><p>提交后由顾问确认日期与资源</p></div><button id="closeBooking">×</button></div><div class="summary-line"><span>线路</span><b id="modalRoute">5天4晚</b></div><div class="summary-line"><span>同行人数</span><b id="modalPeople">待确认</b></div><div class="summary-line"><span>套餐总价</span><strong id="modalPrice">顾问报价</strong></div><div class="form-row"><label>意向出发日期</label><div class="fake-input"><span>请选择日期</span><span>›</span></div></div><div class="form-row"><label>联系人</label><div class="fake-input"><span>姓名与手机号</span><span>›</span></div></div><button class="modal-submit" id="submitBooking">提交预订意向</button></div></div><div class="toast" id="toast">提交成功，顾问会尽快联系你</div><script src="route-data.js"></script><script>initRouteHub();document.getElementById('closeBooking').onclick=()=>bookingModal.classList.remove('show');bookingModal.onclick=e=>{if(e.target===bookingModal)bookingModal.classList.remove('show')};document.getElementById('submitBooking').onclick=()=>{bookingModal.classList.remove('show');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)};</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>确认订单</title><link rel="stylesheet" href="prototype.css"><link rel="stylesheet" href="party.css"></head><body><main class="app"><div class="status"><span>9:41</span><span>● ● ▰</span></div><nav class="nav"><a href="experiences.html">‹</a><strong>确认订单</strong><a href="#">···</a></nav><header class="detail-head"><h1>确认体验与日期</h1><p>多项体验一起结算，到店后使用一张二维码核销。</p></header><section class="section alt checkout-date-section"><h2>游玩／入住日期</h2><p class="desc">请再次确认，结算后将按所选日期锁定库存。</p><label class="checkout-date"><div><b>选择日期</b><span id="dateHint">2026年8月20日 · 周四</span></div><input id="visitDate" type="date" value="2026-08-20" min="2026-08-20" max="2027-08-20"><i>›</i></label></section><section class="section alt party-section"><h2>体验人数</h2><p class="desc">请填写实际到店的成人和儿童人数。</p><div class="party-selector" data-party><div><span><b>成人</b><small>年满12周岁</small></span><div class="party-counter"><button data-kind="adult" data-d="-1">−</button><b data-value="adult">1</b><button data-kind="adult" data-d="1">＋</button></div></div><div><span><b>儿童</b><small>未满12周岁</small></span><div class="party-counter"><button data-kind="child" data-d="-1">−</button><b data-value="child">0</b><button data-kind="child" data-d="1">＋</button></div></div></div></section><section class="section alt cart-product-section"><div class="cart-section-title"><h2>已选项目</h2><span>日期统一应用于以下项目</span></div><div id="cartItems" class="cart-items"></div></section><section class="section"><h2>联系人信息</h2><div class="form-row"><label>体验人／入住人</label><div class="fake-input"><span>填写姓名与手机号</span><span>›</span></div></div><div class="form-row"><label>备注</label><div class="fake-input"><span>儿童年龄、饮食忌口、房型要求等</span><span>›</span></div></div><div class="notice">确认结算后才会扣减所选日期的库存，并生成一张包含全部项目的核销二维码。</div></section><div class="bottom-space"></div><div class="bottom checkout-bottom"><div><small>合计</small><strong id="checkoutTotal">¥0</strong></div><button class="primary" id="checkoutBtn">确认结算</button></div></main><script src="inventory.js"></script><script src="party.js"></script><script>renderCart();initPartyCounters('experience');</script></body></html>
